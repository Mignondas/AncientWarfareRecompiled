# Gradle / JVM settings
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings (better parameter names and javadoc)
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.264
loader_version_range=[1,)

# Mod properties
# Must be lowercase, fit [a-z][a-z0-9_]{1,63}, and match the @Mod value in the main class
mod_id=ancientwarfarerecompiled
mod_name=AncientWarfareRecompiled
# Original Ancient Warfare 2 is GPL-3.0 or later (Copyright (C) 2013-2015 Shadowmage)
mod_license=GPL-3.0-or-later
mod_version=0.1.39-alpha
mod_group_id=net.shadowmage.ancientwarfarerecompiled
